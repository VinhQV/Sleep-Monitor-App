[platformio]
default_envs = xiao_sensors

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson@6.21.5
build_flags = -Wall

[env:gateway]
build_src_filter = +<common/> +<gateway/>
lib_deps =
  ${env.lib_deps}
  knolleary/PubSubClient@2.8
  adafruit/Adafruit SHT31 Library@2.2.2
  claws/BH1750@1.3.0

[env:lamp]
build_src_filter = +<common/> +<lamp/>

[env:xiao_sht30]
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<xiao_sht30/>
lib_deps =
  adafruit/Adafruit SHT31 Library@2.2.2

[env:xiao_sleep_ai]
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<xiao_sleep_ai/>
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SHT31 Library@2.2.2

[env:xiao_sensors]
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<xiao_sensors/>
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SHT31 Library@2.2.2
